version: 1
applications:
  - appRoot: task-manager
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node --version
            - cd amplify && npm ci && cd ..
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
